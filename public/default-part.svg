<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Metallic Gradient for Arm -->
    <linearGradient id="metalArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Metallic Cylinder Gradient -->
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ball Joint Chrome Gradient -->
    <radialGradient id="chromeBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="65%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <!-- Red Accent Gradient -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FE0000" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Rubber Bushing Gradient -->
    <radialGradient id="rubberBushing" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="0" cy="0" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <rect width="600" height="600" fill="url(#grid)" />

  <!-- Subtle Radial Glow behind Part -->
  <circle cx="300" cy="290" r="220" fill="#38bdf8" fill-opacity="0.04" />
  <circle cx="300" cy="290" r="160" fill="#FE0000" fill-opacity="0.05" />

  <!-- Technical Circular Crosshairs & Dimension Rings -->
  <circle cx="300" cy="290" r="190" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="300" cy="290" r="130" fill="none" stroke="#334155" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4" />
  <line x1="80" y1="290" x2="520" y2="290" stroke="#334155" stroke-width="0.75" stroke-dasharray="3 5" opacity="0.3" />
  <line x1="300" y1="80" x2="300" y2="500" stroke="#334155" stroke-width="0.75" stroke-dasharray="3 5" opacity="0.3" />

  <!-- Top Header Banner / Badge -->
  <g transform="translate(40, 36)">
    <rect width="180" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#FE0000" />
    <text x="28" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">OEM SPECIFICATION</text>
  </g>

  <g transform="translate(430, 36)">
    <rect width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="65" y="17" fill="#38bdf8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">REF: GENUINE</text>
  </g>

  <!-- Precision Mechanical Part: Front Lower Suspension Control Arm & Bushing Assembly -->
  <g transform="translate(300, 285) rotate(-15)">
    <!-- Shadow -->
    <path d="M -160 50 C -120 -40 -20 -90 120 -60 C 150 -20 170 30 140 70 C 50 110 -60 120 -160 50 Z"
          fill="#000000" opacity="0.45" filter="blur(8px)" />

    <!-- Main Forged Arm Body -->
    <path d="M -150 40 
             C -110 -30 -20 -70 120 -50 
             C 145 -15 160 25 130 60 
             C 40 95 -50 105 -150 40 Z"
          fill="url(#metalArm)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Inner Ribs / Weight Reduction Cutouts -->
    <path d="M -90 20 C -60 -25 -10 -45 50 -35 C 40 -10 -10 15 -40 25 Z" 
          fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <path d="M 65 -25 C 90 -20 110 -10 100 15 C 80 20 60 10 55 -5 Z" 
          fill="#0f172a" stroke="#475569" stroke-width="1.5" />

    <!-- Left Bushing Housing (Large Pivot) -->
    <g transform="translate(-150, 40)">
      <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#64748b" stroke-width="2" />
      <circle cx="0" cy="0" r="38" fill="url(#cylinderGrad)" stroke="#475569" stroke-width="1" />
      <!-- Rubber Bushing Core -->
      <circle cx="0" cy="0" r="28" fill="url(#rubberBushing)" stroke="#0f172a" stroke-width="1.5" />
      <!-- Inner Steel Sleeve (Bolt Hole) -->
      <circle cx="0" cy="0" r="14" fill="url(#metalArm)" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="#020617" />
    </g>

    <!-- Secondary Bushing Mount (Upper Arm Pivot) -->
    <g transform="translate(-10, -70)">
      <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
      <circle cx="0" cy="0" r="24" fill="url(#rubberBushing)" stroke="#0f172a" stroke-width="1" />
      <circle cx="0" cy="0" r="11" fill="url(#metalArm)" stroke="#94a3b8" stroke-width="1" />
      <circle cx="0" cy="0" r="6" fill="#020617" />
    </g>

    <!-- Right Ball Joint Assembly -->
    <g transform="translate(130, 45)">
      <!-- Ball Joint Stud Base -->
      <path d="M -18 -15 L 18 -15 L 12 -42 L -12 -42 Z" fill="url(#cylinderGrad)" stroke="#64748b" stroke-width="1" />
      <!-- Dust Boot Rubber Accordion -->
      <ellipse cx="0" cy="-18" rx="20" ry="7" fill="#1e293b" stroke="#0f172a" stroke-width="1" />
      <ellipse cx="0" cy="-26" rx="17" ry="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <ellipse cx="0" cy="-34" rx="14" ry="5" fill="#1e293b" stroke="#0f172a" stroke-width="1" />
      <!-- Chrome Ball Stud Pin -->
      <path d="M -6 -42 L 6 -42 L 7 -68 L -7 -68 Z" fill="url(#cylinderGrad)" stroke="#94a3b8" stroke-width="1" />
      <circle cx="0" cy="-72" r="9" fill="url(#chromeBall)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Threaded Stud Tip with Cotter Pin Hole -->
      <rect x="-4.5" y="-90" width="9" height="18" rx="2" fill="url(#metalArm)" stroke="#64748b" stroke-width="0.75" />
      <circle cx="0" cy="-82" r="2" fill="#020617" />
      <!-- Castle Nut -->
      <rect x="-8" y="-79" width="16" height="7" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.75" />
    </g>
  </g>

  <!-- Technical Overlay Callouts & Dimension Markers -->
  <!-- Callout 1: Bushing -->
  <g transform="translate(100, 390)">
    <line x1="45" y1="-30" x2="8" y2="0" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="45" cy="-30" r="3" fill="#38bdf8" />
    <rect x="-60" y="0" width="135" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="8" y="16" fill="#38bdf8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">OEM HEAVY BUSHING</text>
  </g>

  <!-- Callout 2: Precision Ball Joint -->
  <g transform="translate(460, 200)">
    <line x1="-30" y1="20" x2="5" y2="-5" stroke="#FE0000" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="-30" cy="20" r="3" fill="#FE0000" />
    <rect x="5" y="-18" width="115" height="24" rx="4" fill="#0f172a" stroke="#FE0000" stroke-width="1" />
    <text x="62" y="-2" fill="#f87171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">BALL STUD ASSEMBLY</text>
  </g>

  <!-- Bottom Brand & Verification Bar -->
  <g transform="translate(40, 500)">
    <rect width="520" height="64" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    
    <g transform="translate(20, 16)">
      <!-- Procurly Logo Mark -->
      <rect width="32" height="32" rx="8" fill="url(#redAccent)" />
      <path d="M 10 16 L 15 22 L 23 11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g transform="translate(64, 25)">
      <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">PROCURLY VERIFIED REFERENCE COMPONENT</text>
      <text x="0" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">Genuine Factory Fitment • Technical Specification Photo</text>
    </g>

    <g transform="translate(440, 23)">
      <rect width="60" height="20" rx="4" fill="#334155" />
      <text x="30" y="14" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">OEM 100%</text>
    </g>
  </g>
</svg>
